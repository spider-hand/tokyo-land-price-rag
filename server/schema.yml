openapi: 3.0.3
info:
  title: Tokyo Land Price RAG API
  version: 1.0.0
paths:
  /api/v1/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/v1/messages/:
    post:
      operationId: messages_create
      tags:
      - messages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    MessageRequest:
      type: object
      properties:
        message:
          type: string
        lat:
          type: number
          format: double
          nullable: true
        lon:
          type: number
          format: double
          nullable: true
        is_point:
          type: boolean
          nullable: true
        language:
          type: string
          nullable: true
          default: en
      required:
      - message
    MessageResponse:
      type: object
      properties:
        response:
          type: string
        ward:
          type: string
          nullable: true
      required:
      - response
      - ward
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
