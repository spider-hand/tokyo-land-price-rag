[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0,<6.1",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "openai>=3.46.0",
    "qdrant-client>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.14.10",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "server.settings"
